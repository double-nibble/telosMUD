# deploy/nats.conf — per-identity NATS authorization (#552 slice 2).
#
# NATS previously ran with CLI args only (`-js -m 8222`) and NO authn/authz, so anything that opened a
# TCP connection to :4222 had full publish rights on every subject — forge a chan/tell with an arbitrary
# author (defeating the P8-A2 impersonation gate), rewrite a player's config.<id>, or delete a JetStream
# stream. This config introduces four identities (world, gate, director, seed), each constrained to the
# publish/subscribe subjects its binary actually uses. An `authorization {}` block cannot be expressed as
# a CLI arg, which is why a config file is introduced here (the command becomes `-c /etc/nats.conf`).
#
# The permission sets were derived by reading the wiring, not the design doc — several rows differ from a
# naive reading (see the per-identity notes). Passwords come from the environment; compose interpolates
# ${TELOS_NATS_*_PASSWORD} into BOTH this server's env and each app service's TELOS_NATS_PASSWORD, so the
# two sides always agree. Absent/wrong credentials degrade a client to a Disabled no-op bus (comms off),
# never a failed boot (the never-fatal rule, #552).

# Monitoring endpoint (was `-m 8222`). JetStream enabled with the default store (was `-js`, no -sd).
http_port: 8222
jetstream {}

authorization {
  # ---- permission sets ----

  # WORLD — the message SOURCE. Publishes player-authored comms (chan/tell/config), durable tells
  # (dtell, JetStream), and its own residents' presence; signals scope events up; creates + consumes the
  # WORLD_EVENTS + COMMS_TELL streams ($JS.API.>). It is ALSO a content.invalidate PUBLISHER: the in-game
  # staff `reload` command propagates a hot content edit across the fleet by publishing content.invalidate
  # (internal/world/reloadcmd.go — contentbus.PublishPack on the live NATS bus). Without that grant, an
  # admin `reload` gets a broker Permissions Violation and the fleet silently does not hot-reload (the
  # smoke path only SUBSCRIBES content.invalidate, so it cannot catch this). Subscribes content.invalidate
  # (its own + peers' invalidations), its scope subjects, and the MAX_DELIVERIES park advisory. _INBOX.> is
  # required or JetStream request/reply hangs.
  WORLD = {
    publish = {
      allow = [
        "telos.comms.chan.*", "telos.comms.tell.*", "telos.comms.config.*",
        "telos.comms.dtell.*", "telos.comms.presence",
        "telos.scope.>",
        "content.invalidate",
        "$JS.API.>"
      ]
    }
    subscribe = {
      allow = [
        "telos.comms.>", "telos.scope.>", "content.invalidate",
        "$JS.EVENT.ADVISORY.CONSUMER.MAX_DELIVERIES.>",
        "_INBOX.>"
      ]
    }
  }

  # GATE — the message SINK. It authors NOTHING on the bus (verified: internal/gate/comms.go makes ZERO
  # Publish/Request/PublishDurable calls — subscribe-only; the broker mirror of the in-process P8-A2/#554
  # ACL). So its publish permission is DENY-BY-DEFAULT — an empty allow-list, not a denylist. A denylist
  # (deny the four roots) still leaves everything ELSE publishable, and the gate is the untrusted-adjacent
  # process this whole slice exists to contain, so it must have the STRICTEST posture, not the loosest. A
  # denylist would have to enumerate every dangerous subject that exists now AND is added later — notably
  # the gate could otherwise forge $JS.EVENT.ADVISORY.CONSUMER.MAX_DELIVERIES.* advisories that the world's
  # park monitor (jetstream_nats.go handleParkAdvisory) trusts as authoritative (fabricated data-loss
  # incidents / ERROR-log spam), plus arbitrary $SYS/_INBOX subjects. `allow = []` closes all of that by
  # construction and stays correct as new subjects appear (#552 slice-2 security review). It subscribes
  # ONLY concrete per-player / per-channel comms subjects (the gate has no contentbus and subscribes no
  # presence — it dials TellSubject/ConfigSubject/ChanSubject/RosterSubject, internal/gate/comms.go).
  GATE = {
    publish = {
      # Deny ALL publish (`>` = every subject). The gate is a pure sink, so this is deny-by-default: it
      # closes the whole comms/scope/JetStream/$SYS/_INBOX/advisory surface in one rule and STAYS correct
      # as new subjects appear. (NB: an empty `allow = []` does NOT do this — NATS treats an empty allow
      # array as "no publish restriction" = allow-all, verified against nats:2.10; `deny = [">"]` is the
      # correct deny-all idiom.) #63's config.* deny is subsumed here.
      deny = [ ">" ]
    }
    subscribe = {
      allow = [
        "telos.comms.chan.*", "telos.comms.tell.*",
        "telos.comms.config.*", "telos.comms.roster.*",
        "_INBOX.>"
      ]
    }
  }

  # DIRECTOR — orchestration. Publishes channel rosters (roster.*), scope broadcasts, and — the row a
  # naive matrix misses — content.invalidate: the director runs the coordinated content-pull path
  # (contentPuller -> contentpull.broadcast), so without this grant a director-coordinated deploy writes
  # the rows but silently fails to hot-reload the fleet. It creates the WORLD_EVENTS stream ($JS.API.>).
  # It subscribes its scope subjects + the JetStream advisories (NOT content.invalidate — the pull-
  # coordination events ride telos.scope.>, not the invalidate subject; verified internal/director).
  DIRECTOR = {
    publish = {
      allow = [
        "telos.comms.roster.*", "telos.scope.>", "content.invalidate", "$JS.API.>"
      ]
    }
    subscribe = {
      allow = [
        "telos.scope.>", "$JS.EVENT.ADVISORY.>", "_INBOX.>"
      ]
    }
  }

  # SEED — the operator/CI content importer (telos-seed AND telos-pull; same publisher identity). Its
  # ONLY job on the bus is to publish content.invalidate after writing rows. _INBOX.> for request/reply.
  SEED = {
    publish = { allow = [ "content.invalidate" ] }
    subscribe = { allow = [ "_INBOX.>" ] }
  }

  users = [
    { user: "world",    password: $TELOS_NATS_WORLD_PASSWORD,    permissions: $WORLD }
    { user: "gate",     password: $TELOS_NATS_GATE_PASSWORD,     permissions: $GATE }
    { user: "director", password: $TELOS_NATS_DIRECTOR_PASSWORD, permissions: $DIRECTOR }
    { user: "seed",     password: $TELOS_NATS_SEED_PASSWORD,     permissions: $SEED }
  ]
}
